<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roland Molnár · Showcase</title>
  <meta name="description" content="Apps and tools Roland Molnár has built: published, in progress and the UI library behind them.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/1826873?v=4&s=64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})()</script>
  <link rel="stylesheet" href="assets/showcase.css">
</head>
<body>
  <div class="app" id="app">
    <header class="bar">
      <a class="brand" href="https://github.com/molnarroland">
        <img id="avatar" src="https://avatars.githubusercontent.com/u/1826873?v=4&s=64" alt="" width="28" height="28">
        <span><b id="brand-name">Roland Molnár</b><small>Apps I build for myself</small></span>
      </a>
      <nav class="bar-links" aria-label="Other views">
        <a href="classic.html">Classic view</a>
      </nav>
      <div class="bar-end">
        <div class="theme-switch" role="radiogroup" aria-label="Colour theme">
          <button type="button" role="radio" data-theme-choice="system" aria-label="Use system theme" title="System">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10" rx="1.8"/><path d="M7 16.5h6M10 13.5v3"/></svg>
          </button>
          <button type="button" role="radio" data-theme-choice="light" aria-label="Light theme" title="Light">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>
          </button>
          <button type="button" role="radio" data-theme-choice="dark" aria-label="Dark theme" title="Dark">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.3A7 7 0 0 1 7.7 3.5a7 7 0 1 0 8.8 8.8Z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="viewer" id="viewer" aria-roledescription="carousel" aria-label="Screenshots">
        <div class="glow" aria-hidden="true"></div>
        <div class="floor" aria-hidden="true"></div>
        <p class="hint" aria-hidden="true"><kbd>←</kbd><kbd>→</kbd> screenshots <kbd>↑</kbd><kbd>↓</kbd> apps · click to focus</p>
        <div class="stage" id="stage">
          <div class="tilt" id="tilt"><div class="track" id="track"></div></div>
        </div>
        <div class="vbar">
          <button type="button" class="round" id="prev" aria-label="Previous screenshot"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4-6 6 6 6"/></svg></button>
          <div class="cap">
            <p><span id="cap-text">Loading…</span> <span class="count" id="cap-count"></span></p>
            <div class="dots" id="dots"></div>
            <div class="progress" id="progress" aria-hidden="true"><i></i></div>
          </div>
          <button type="button" class="round" id="next" aria-label="Next screenshot"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4 6 6-6 6"/></svg></button>
          <span class="vsep" aria-hidden="true"></span>
          <button type="button" class="round" id="play" aria-pressed="true" aria-label="Pause the tour" title="Pause the tour">
            <svg class="i-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5v11M13 4.5v11"/></svg>
            <svg class="i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.5v11l9-5.5Z"/></svg>
          </button>
          <button type="button" class="round only-wide" id="focus" aria-pressed="false" aria-label="Hide the details panel" title="Focus on the screenshots">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5v-4h4M16.5 7.5v-4h-4M3.5 12.5v4h4M16.5 12.5v4h-4"/></svg>
          </button>
        </div>
        <p class="sr-only" aria-live="polite" id="live"></p>
      </section>

      <aside class="details" id="details" aria-label="About this app"></aside>
    </main>

    <nav class="dock" aria-label="Apps"><div class="dock-in" id="dock"></div></nav>
  </div>

  <script src="assets/showcase.js"></script>
</body>
</html>
