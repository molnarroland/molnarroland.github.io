name: Update data snapshot

# Refreshes data/*.json, the fallback the page uses when the live GitHub API
# is rate-limited or unreachable.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch profile and repositories
        env:
          GH_TOKEN: ${{ github.token }}
          USER: molnarroland
        run: |
          gh api "users/$USER" > data/profile.json
          gh api "users/$USER/repos?per_page=100&sort=pushed" > data/repos.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update data snapshot"
          git push
